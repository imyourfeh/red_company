<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Cliente | REDCOMPANY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">

    <main style="background: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12); max-width: 420px; width: 100%;">
        <h1 style="color: #0F172A; font-size: 1.6rem; margin-bottom: 8px;">Portal do Cliente</h1>
        <p style="color: #475569; font-size: 14px; margin-bottom: 24px;">Acesse suas licenças, faturas e chamados de suporte.</p>

        <form action="#" method="POST">
            <div class="form-group" style="margin-bottom: 16px;">
                <label for="usuario" style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #0F172A;">Usuário ou CNPJ</label>
                <input type="text" id="usuario" name="usuario" placeholder="Digite seu login" required style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 6px;">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label for="senha" style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #0F172A;">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="••••••••" required style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 6px;">
            </div>

            <button type="submit" class="btn-hero-primary" style="width: 100%; border: none; cursor: pointer;">Entrar no Sistema</button>
        </form>

        <div style="margin-top: 24px; text-align: center;">
            <a href="index.html" style="color: #0F172A; font-size: 14px; font-weight: 500; text-decoration: underline;">&larr; Voltar para a Página Inicial</a>
        </div>
    </main>

</body>
</html>
